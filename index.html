<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FEF7FF" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141218" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />

<!-- Set light or dark mode before anything draws, from Settings > Appearance (default: follow the device). -->
<script>try{var m=localStorage.getItem("dtt.colorMode");if(m!=="light"&&m!=="dark")m=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.mode=m}catch(e){}</script>
